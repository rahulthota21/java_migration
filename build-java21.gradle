plugins {
    id 'jacoco'
    id 'java'
    id 'org.springframework.boot' version '3.2.12'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.freddiemac.infolens'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-jersey'
    implementation 'org.springframework.boot:spring-boot-devtools'

    // Cloud / Feign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.3'
    implementation 'io.github.openfeign:feign-okhttp:13.1'

    // Security
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-web'

    // Database
    implementation 'com.microsoft.sqlserver:mssql-jdbc:12.4.2.jre11'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.21'
    implementation 'org.webjars:swagger-ui:5.17.14'

    // Utilities
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.codehaus.janino:janino:3.1.12'
    implementation 'org.modelmapper:modelmapper:3.2.0'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'org.springframework.hateoas:spring-hateoas'
    implementation 'commons-beanutils:commons-beanutils:1.10.0'
    implementation 'commons-net:commons-net:3.11.1'
    implementation 'org.apache.tika:tika-core:2.9.4'
    implementation 'com.google.guava:guava:32.0.0-jre'

    // Test
    testImplementation 'pl.pojo:pojo-tester:0.7.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.5.4'
    testImplementation 'org.mockito:mockito-core:5.12.0'
}

test { 
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport { 
    dependsOn test 
}
